name: Refresh feed

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild feed from the public sitemap
        env:
          FEED_PUBLIC_URL: https://bertwin007.github.io/theinsurer-rss/feed.xml
        run: python build_feed.py
      - name: Publish updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --staged --quiet; then
            echo "Feed unchanged"
          else
            git commit -m "Refresh feed from sitemap"
            git push
          fi
